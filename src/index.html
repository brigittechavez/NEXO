<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NEXO — Mentoring que conecta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NEXO conecta profesionales con mentores expertos. Sessions 1:1 personalizadas para impulsar tu carrera.">
  <meta name="theme-color" content="#5B4BFF">

  <!-- Open Graph. SeoService overrides title/description/url/image per route;
       these are the defaults for any crawler that reads the raw document. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NEXO — Encuentra a quien ya recorrió tu camino">
  <meta property="og:description" content="Conecta con mentores que ya lograron lo que tú quieres conseguir. Reserva una sesión y convierte su experiencia en objetivos, tareas y progreso real.">
  <meta property="og:site_name" content="NEXO">
  <meta property="og:locale" content="es_ES">
  <meta property="og:image" content="https://nexo-mentoring.com/assets/images/social/og-nexo.png">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="909">
  <meta property="og:image:alt" content="NEXO — plataforma de mentoría">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NEXO — Encuentra a quien ya recorrió tu camino">
  <meta name="twitter:description" content="Conecta con mentores que ya lograron lo que tú quieres conseguir. Reserva una sesión y convierte su experiencia en objetivos, tareas y progreso real.">
  <meta name="twitter:image" content="https://nexo-mentoring.com/assets/images/social/og-nexo.png">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon, generated from the NEXO brand mark -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://nexo-mentoring.com">

  <!-- Resolve the theme before first paint so dark-mode users never see a light flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nexo-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
